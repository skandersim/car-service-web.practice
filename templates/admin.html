<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автосервис • Практика</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- шапка -->
    <header id="header">
        <a href="#home" class="logo">
            <svg width="32" height="32" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="8" y="4" width="20" height="14" rx="3" fill="#dc2626"/>
                <rect x="10" y="8" width="16" height="2" rx="1" fill="#111"/>
                <rect x="10" y="12" width="16" height="2" rx="1" fill="#111"/>
                <rect x="15" y="18" width="6" height="11" rx="1" fill="#ffffff"/>
                <circle cx="18" cy="21" r="2" fill="#111"/>
                <circle cx="18" cy="31" r="3" fill="#ffffff"/>
                <circle cx="18" cy="31" r="1.5" fill="#111"/>
            </svg>
            <h2>Авто<span>Практик</span></h2><span class="header-text">Админская панель</span>
        </a>

        <div class="nav-actions">
            <button class="btn icon-btn" id="themeToggle" title="Тёмная / светлая тема" aria-label="Переключить тему">
                <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2"/><path d="M12 20v2"/>
                    <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
                    <path d="M2 12h2"/><path d="M20 12h2"/>
                    <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
                </svg>
            </button>
            <a href="/" class="btn btn-primary" id="record">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m12 19-7-7 7-7"/>
                    <path d="M19 12H5"/>
                </svg>
                На сайт
            </a>
        </div>
    </header>

    <section id="top-row">
        <div class="container">
            <div class="section-head reveal">
                <h2 class="section-title">Статистика</h2>
            </div>
            <div class="top-row-grid reveal">
                <article class="top-row-card reveal">
                    <div class="card-head">
                        <div class="f-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                                <rect x="8" y="2" width="8" height="4" rx="1"/>
                                <path d="M9 12h6"/>
                                <path d="M9 16h6"/>
                            </svg>
                        </div>
                        <h2>Всего заявок</h2>
                    </div>
                    <span id="total">0</span>
                </article>
                <article class="top-row-card reveal">
                    <div class="card-head">
                        <div class="f-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
                            </svg>
                        </div>
                        <h2>Новые</h2>
                    </div>
                    <span id="new">0</span>
                </article>
                <article class="top-row-card reveal">
                    <div class="card-head">
                        <div class="f-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                            </svg>
                        </div>
                        <h2>В работе</h2>
                    </div>
                    <span id="work">0</span>
                </article>
                <article class="top-row-card reveal">
                    <div class="card-head">
                        <div class="f-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/>
                                <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>
                            </svg>
                        </div>
                        <h2>Выручка</h2>
                    </div>
                    <span id="revenue">0</span>
                </article>
            </div>
        </div>
    </section>

    <section id="main">
        <div class="container">
            <div class="section-head reveal">
                <h2 class="section-title">Текущие заявки</h2>
            </div>
            <div class="table-wrap">
                <table class="admin-table reveal">
                    <thead class="reveal">
                        <tr>
                            <th>ID</th>
                            <th>Клиент</th>
                            <th>Телефон</th>
                            <th>Услуга</th>
                            <th>Дата и время</th>
                            <th>Сумма (₽)</th>
                            <th>Статус</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="recordsBody"></tbody>
                </table>
            </div>
        </div>
    </section>
    <script src="/admin.js"></script>
</body>
</html>
